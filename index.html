<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Vật Lý 12</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            startup: {
                typeset: false // Để JavaScript chủ động kiểm soát thời điểm render công thức
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h3>HỆ THỐNG BẢO MẬT</h3>
            <p>Vui lòng nhập thông tin để vào phòng luyện tập</p>
            <input type="text" id="userInput" placeholder="Nhập Họ và Tên của bạn...">
            <input type="password" id="passInput" placeholder="Nhập mật khẩu truy cập...">
            
            <div style="text-align: left; margin: 0 0 15px 4px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--text-secondary); cursor: pointer;">
                    <input type="checkbox" id="chkRememberMe" style="accent-color: var(--primary-color);"> Ghi nhớ đăng nhập
                </label>
            </div>

            <button class="login-btn" onclick="handleLogin()">Đăng nhập vào hệ thống</button>
            <p id="login-error" style="color: #ef4444; font-size: 0.88rem; margin-top: 12px; display: none; font-weight: 600;"></p>
        </div>
    </div>

    <header class="app-header">
        <div class="container">
            <h1>Ôn tập vật lý 12</h1>
            <nav class="main-tabs" id="mainTabs">
                <button class="tab-btn active" onclick="switchTopic('nhiet', this)">Nhiệt Học</button>
                <button class="tab-btn" onclick="switchTopic('khi', this)">Khí Lý Tưởng</button>
                <button class="tab-btn" onclick="switchTopic('tu', this)">Từ Trường</button>
                <button class="tab-btn" onclick="switchTopic('hatnhan', this)">Vật Lý Hạt Nhân</button>
                <button class="tab-btn" style="color: #f43f5e;" onclick="switchTopic('khac-phuc-loi', this)">🚨 Khắc phục lỗi sai</button>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 24px;">
        <section id="contentArea" class="content-area">
            </section>
    </main>

    <script src="data.js"></script>
    <script src="app_logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
